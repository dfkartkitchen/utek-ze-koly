# Útěk ze školy – statická hra v jednom souboru, bez buildu.
# Složka relay/ je multiplayer server pro Cloudflare Workers (nasazuje se zvlášť, viz relay/README.md).
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/mp-config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

